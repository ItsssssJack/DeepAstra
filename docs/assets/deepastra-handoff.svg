  <text x="432" y="415" font-size="29" font-weight="700" fill="#f2f5fc">DeepAstra</text>
  <text x="432" y="451" font-size="20" fill="#b6c3d7">launch.py starts a session.</text>
  <text x="432" y="480" font-size="17" fill="#8c9bb1">Separate Codex CLI process.</text>
 </g>
 <g>
