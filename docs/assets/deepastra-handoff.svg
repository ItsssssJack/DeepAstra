  <text x="86" y="451" font-size="20" fill="#b6c3d7">Writes the task brief.</text>
  <text x="86" y="480" font-size="17" fill="#8c9bb1">Defines what success means.</text>
 </g>
 <g>
  <rect x="410" y="254" width="280" height="257" rx="21" fill="#151c29" stroke="#374155"/>
