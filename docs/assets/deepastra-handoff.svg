<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750" role="img" aria-labelledby="title desc">
<title id="title">How DeepAstra works</title><desc id="desc">Astra writes a task brief. DeepAstra's launch.py starts a separate Codex CLI session powered by the DeepSeek API. That session uses files and terminal tools to produce deliverables. Astra reviews the output. The harness runs locally and the model runs through an API.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10141e"/><stop offset="1" stop-color="#080c13"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1" y2="1"><stop stop-color="#245ac8"/><stop offset=".6" stop-color="#12346c"/><stop offset="1" stop-color="#101e35"/></linearGradient>
 <linearGradient id="wire"><stop stop-color="#8e9db6"/><stop offset=".6" stop-color="#72aeff"/><stop offset="1" stop-color="#a8d8ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#2965c4" stop-opacity=".22"/><stop offset="1" stop-color="#2965c4" stop-opacity="0"/></radialGradient>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="#8bb6f4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1440" height="750" rx="28" fill="url(#bg)"/>
<ellipse cx="900" cy="355" rx="540" ry="300" fill="url(#halo)"/>
<g font-family="Arial,Helvetica,sans-serif">
 <rect x="64" y="50" width="130" height="30" rx="15" fill="#162238" stroke="#345075"/><circle cx="83" cy="65" r="3" fill="#84baff"/><text x="97" y="70" fill="#b0c9ee" font-size="12" letter-spacing="2">DEEPASTRA</text>
 <text x="64" y="144" font-size="43" font-weight="700" fill="#f1f5fc" letter-spacing="-1.3">Astra delegates. DeepSeek executes.</text>
 <text x="66" y="183" font-size="21" fill="#a6b5ca">A launcher and instructions for running DeepSeek through the Codex CLI.</text>
 <g fill="none" stroke="url(#wire)" stroke-width="2" marker-end="url(#arrow)">
